name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# Permissions the Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clean install from package-lock.json (so commit that file)
      - run: npm ci

      # Runs tsc then vite build; output goes to dist/
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4